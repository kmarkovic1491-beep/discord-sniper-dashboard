name: Pomelo API smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pomelo-smoke-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test deployed checker against Pomelo
        shell: bash
        run: |
          set +e
          echo "Testing backend health..."
          curl -fsS --max-time 20 https://snipers-og-apify-checker.onrender.com/health
          echo
          echo "Testing Pomelo username lookup through backend..."
          curl -sS --max-time 60 -w '\nHTTP_STATUS:%{http_code}\n' -X POST https://snipers-og-apify-checker.onrender.com/api/check -H 'Content-Type: application/json' --data '{"username":"pomelosmoketestx"}'
