

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord Username Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d19;color:#eee;font-family:Arial,sans-serif;padding:20px}
main{max-width:650px;margin:auto}
h1{color:#b69aff}
.panel{background:#1d1829;border:1px solid #382d50;border-radius:14px;padding:18px;margin:14px 0}
button{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:5px}
.start{background:#8b5cf6;color:white}
.stop{background:#e05252;color:white}
.secondary{background:#393047;color:white}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #55456e;background:#100d19;color:white;margin:8px 0}
.status{font-weight:bold;color:#facc15}
.good{color:#4ade80}
.bad{color:#fb7185}
li{padding:6px 0;overflow-wrap:anywhere}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>
<main>
<h1>🎯 Discord Username Dashboard</h1>
<p class="small">Automatic username checker</p>

<div class="panel">
  <h3>Checker status</h3>
  <p id="status" class="status">CONNECTING...</p>
  <p id="current">Waiting for first check...</p>
  <button class="start" onclick="startSniping()">START</button>
  <button class="stop" onclick="stopSniping()">STOP</button>
</div>

<div class="panel">
  <h3>Settings</h3>
  <label>Backend URL</label>
  <input id="backend" value="https://username-sniper-backend.onrender.com">
  <p class="small">Checks are limited by the backend to at least 2 seconds apart.</p>
</div>

<div class="panel">
  <h3>Available usernames</h3>
  <ul id="available"></ul>
</div>

<div class="panel">
  <h3>Recent checks</h3>
  <ul id="history"></ul>
</div>

<div class="panel">
  <h3>Favourites</h3>
  <ul id="favourites"></ul>
</div>
</main>

<script>
let running = false;
let checking = false;
let favourites = [];
let historyItems = [];
let availableItems = [];

const $ = id => document.getElementById(id);

function showStatus(message, color="status") {
  $("status").textContent = message;
  $("status").className = color;
}

function generateUsername() {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  const length = Math.random() < 0.5 ? 3 : 4;
  let name = "";
  for(let i=0;i<length;i++){
    name += chars[Math.floor(Math.random()*chars.length)];
  }
  return name;
}

function addHistory(name, result) {
  historyItems.unshift(name + " — " + result);
  historyItems = historyItems.slice(0,20);
  $("history").innerHTML = historyItems.map(x=>"<li>"+x+"</li>").join("");
}

function addAvailable(name) {
  if(!availableItems.includes(name)){
    availableItems.unshift(name);
    $("available").innerHTML = availableItems.map(x=>"<li>"+x+
      ' <button class="secondary" onclick="addFavourite(\''+x+'\')">♥ Save</button></li>'
    ).join("");
  }
}

function addFavourite(name) {
  if(!favourites.includes(name)){
    favourites.push(name);
    $("favourites").innerHTML = favourites.map(x=>"<li>"+x+"</li>").join("");
  }
}

async function checkOne() {
  if(checking) return;
  checking = true;

  const name = generateUsername();
  $("current").textContent = "Checking: " + name;

  try {
    const base = $("backend").value.trim().replace(/\/$/,"");
    const response = await fetch(base + "/check", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:name})
    });

    const data = await response.json();

    if(response.status === 429 || data.status === "RATE_LIMITED"){
      addHistory(name,"RATE LIMITED");
      showStatus("RATE LIMITED — STOPPED","bad");
      running = false;
      return;
    }

    if(!response.ok){
      throw new Error(data.error || "Request failed");
    }

    if(data.status === "AVAILABLE"){
      addHistory(name,"AVAILABLE");
      addAvailable(name);
      $("current").textContent = name + " appears available!";
    } else if(data.status === "TAKEN"){
      addHistory(name,"TAKEN");
    } else {
      addHistory(name,data.status || "UNKNOWN");
    }

  } catch(error) {
    showStatus("ERROR: " + error.message,"bad");
    running = false;
  } finally {
    checking = false;
  }
}

async function startSniping() {
  if(running) return;

  running = true;
  showStatus("RUNNING","good");

  while(running){
    await checkOne();
    if(running){
      await new Promise(resolve=>setTimeout(resolve,2000));
    }
  }
}

function stopSniping() {
  running = false;
  showStatus("STOPPED");
  $("current").textContent = "Checker stopped.";
}

async function connectBackend() {
  try {
    const base = $("backend").value.trim().replace(/\/$/,"");
    const response = await fetch(base + "/");
    if(!response.ok) throw new Error("Backend unavailable");
    const data = await response.json();

    if(data.status === "online"){
      showStatus("CONNECTED","good");
      startSniping();
    } else {
      showStatus("BACKEND NOT READY","bad");
    }
  } catch(error) {
    showStatus("CONNECTION ERROR — " + error.message,"bad");
  }
}

window.addEventListener("load", connectBackend);
</script>
</body>
</html>
